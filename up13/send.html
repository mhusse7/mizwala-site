<!doctype html><meta charset="utf-8"><script>
// Temporary helper for App Store Connect (its CSP blocks fetching other origins): sends the files to the parent.
(async () => {
  const names = ['listings.json'].concat([1,2,3,4,5,6,7,8,9].map(n => `iphone-${n}.png`), [1,2,3].map(n => `ipad-${n}.png`));
  for (const name of names) {
    const blob = await (await fetch(name, {cache: 'no-store'})).blob();
    parent.postMessage({mizwala: true, name, blob}, 'https://appstoreconnect.apple.com');
  }
  parent.postMessage({mizwala: true, done: true}, 'https://appstoreconnect.apple.com');
})();
</script>
